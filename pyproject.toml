[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bevmapmatch"
version = "0.1.0"
description = "Clean reproduction code for BEVMapMatch coarse-to-fine re-localization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.38",
  "tqdm>=4.66",
  "opencv-python>=4.8",
  "nuscenes-devkit>=1.1.11",
  "pyquaternion>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
